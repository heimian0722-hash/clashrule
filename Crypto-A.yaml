payload:
  # --- Coinbase 核心与支付网关 ---
  - '+.coinbase.com'
  - '+.coinbasecloud.net'
  - '+.coinbasecloud.dev'
  - '+.coinbasewallet.com'
  - '+.commerce.coinbase.com'
  - '+.help.coinbase.com'
  - '+.static-assets.coinbase.com'
  - '+.onramp.wallet.coinbase.com'
  - '+.chain-proxy.wallet.coinbase.com'

  # --- Base 生态 (Coinbase L2) ---
  - '+.base.org'
  - '+.basescan.org'
  - '+.mainnet.base.org'
  - '+.bridge.base.org'

  # --- Kraken (含荷兰/欧洲节点)  ---
  - '+.kraken.com'
  - '+.api.kraken.com'
  - '+.futures.kraken.com'
  - '+.kraken-assets.com'
  - '+.cryptowat.ch'
  - '+.nl.kraken.com'        # 荷兰 Kraken 节点

  # --- 美系合规与银行绑定服务 ---
  - '+.circle.com'        # USDC 相关
  - '+.usdc.com'
  - '+.plaid.com'         # 银行卡 ACH 绑定必备
  - '+.trustly.com'       # 支付网关
  - '+.cb.id'             # Coinbase 域名服务

  # --- ether.fi 生态 (LST / 质押与个人资产账户) ---
  - '+.ether.fi'
  - '+.help.ether.fi'
  - '+.governance.ether.fi'

  # --- Plasma 生态 (稳定币 L1 / XPL) ---
  - '+.plasma.to'
  - '+.plasmascan.org'

  # --- Kast 生态 (Web3 稳定币支付卡 / 钱包应用) ---
  - '+.kast.finance'
  - '+.kastfinance.app'
